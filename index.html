<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Oceania Galaxy</title>
		<meta name="theme-color" content="#070a14">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* ---- Oceania Galaxy loading page: dark starfield, the name, a thin bar with a percentage ---- */
#status {
	background: radial-gradient(ellipse at 50% 40%, #14224a 0%, #070a14 70%);
	font-family: 'Bai Jamjuree', 'Noto Sans Thai', 'Leelawadee UI', 'Tahoma', 'Segoe UI', Arial, sans-serif;
}

#status-splash {
	display: none;
}

#brand {
	text-align: center;
	margin-bottom: 8vh;
	user-select: none;
}

#brand-logo {
	width: clamp(84px, 14vw, 140px);
	height: auto;
	margin-bottom: 18px;
	filter: drop-shadow(0 0 22px rgba(79, 140, 255, 0.45));
}

#brand-name {
	font-size: clamp(28px, 6vw, 64px);
	font-weight: 700;
	letter-spacing: 0.18em;
	color: #eef2ff;
	text-shadow: 0 0 24px rgba(79, 140, 255, 0.55);
}

#brand-line {
	width: min(60vw, 420px);
	height: 2px;
	margin: 14px auto;
	background: linear-gradient(90deg, transparent, #4f8cff, transparent);
}

#brand-tag {
	font-size: clamp(13px, 1.8vw, 18px);
	color: #a9b5d6;
}

#loading {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 12%;
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	color: #a9b5d6;
	font-size: 14px;
}

#loading-bar {
	width: min(50vw, 360px);
	height: 6px;
	border-radius: 3px;
	background: #1b2547;
	border: 1px solid #44558f;
	overflow: hidden;
}

#loading-fill {
	height: 100%;
	width: 0;
	background: linear-gradient(90deg, #4f8cff, #8ff5c5);
	transition: width 0.15s linear;
}

#loading-bar.indeterminate #loading-fill {
	width: 35%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { margin-left: 0; }
	to { margin-left: 65%; }
}

#status-progress {
	display: none !important;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1204600,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	const loading = document.getElementById('loading');
	const loadingBar = document.getElementById('loading-bar');
	const loadingFill = document.getElementById('loading-fill');
	const loadingText = document.getElementById('loading-text');

	// The page follows the browser language (the game itself remembers the player's own choice).
	const lang = (navigator.language || 'en').toLowerCase().startsWith('th') ? 'th' : 'en';
	document.documentElement.lang = lang;
	document.querySelectorAll('[data-en]').forEach((el) => {
		el.textContent = el.getAttribute('data-' + lang);
	});
	const loadingWord = loadingText.getAttribute('data-' + lang);
	loadingText.textContent = loadingWord + '...';

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loading.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.floor((current / total) * 100));
					loadingBar.classList.remove('indeterminate');
					loadingFill.style.width = pct + '%';
					loadingText.textContent = loadingWord + ' ' + pct + '%';
				} else {
					loadingBar.classList.add('indeterminate');
					loadingFill.style.width = '';
					loadingText.textContent = loadingWord + '...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
